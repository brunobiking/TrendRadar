# TrendRadar Configuration Example
# This file demonstrates all available configuration options with explanations

# =============================================================================
# APPLICATION SETTINGS
# =============================================================================
app:
  # URL to check for version updates
  version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version"
  
  # Show version update notifications
  # Set to false to disable update prompts
  show_version_update: true

# =============================================================================
# CRAWLER SETTINGS
# =============================================================================
crawler:
  # Request interval in milliseconds between API calls
  # Increase if hitting rate limits (try 2000-5000)
  request_interval: 1000
  
  # Enable/disable news crawling
  # Set to false for testing notification setup only
  enable_crawler: true
  
  # Use proxy for requests (useful in restricted networks)
  use_proxy: false
  
  # Proxy server URL (only used if use_proxy is true)
  default_proxy: "http://127.0.0.1:10086"

# =============================================================================
# REPORT MODE CONFIGURATION
# =============================================================================
report:
  # Push mode determines what and when news is sent
  # Options:
  #   "daily"       - All matching news of the day (comprehensive)
  #   "current"     - Current top rankings (real-time)
  #   "incremental" - Only new items (avoid duplicates)
  mode: "daily"
  
  # Ranking threshold for highlighting
  # News ranked ≤ this value appear in bold red
  rank_threshold: 5

# =============================================================================
# NOTIFICATION SETTINGS
# =============================================================================
notification:
  # Master switch for all notifications
  # Set to false to only generate HTML reports without notifications
  enable_notification: true
  
  # ---------------------------------------------------------------------------
  # PUSH TIME WINDOW (Optional Feature)
  # ---------------------------------------------------------------------------
  # Control WHEN notifications are sent to avoid disturbances
  push_window:
    # Enable time window control
    enabled: false
    
    # Time range (Beijing Time, format: HH:MM)
    time_range:
      start: "08:00"  # Start of notification window
      end: "22:00"    # End of notification window
    
    # Push only once per day within the window
    # If false, pushes every execution within window
    once_per_day: true
    
    # Days to keep push history records
    push_record_retention_days: 7
  
  # ---------------------------------------------------------------------------
  # NOTIFICATION WEBHOOKS
  # ---------------------------------------------------------------------------
  # ⚠️ SECURITY WARNING:
  # - For GitHub Fork deployment: DO NOT fill in webhooks here!
  #   Use GitHub Secrets instead (Settings → Secrets → Actions)
  # - For Local/Docker: Safe to fill in here
  # - Never commit sensitive credentials to public repositories!
  
  webhooks:
    # Email Notification
    # Sender email address
    email_from: ""
    
    # Email password or authorization code (NOT your account password!)
    # Gmail: Use App Password (requires 2FA)
    # QQ Mail: Use Authorization Code
    # 163/126: Use Authorization Code
    email_password: ""
    
    # Recipient email address(es)
    # Multiple recipients: separate with commas (no spaces)
    # Example: "user1@example.com,user2@example.com"
    email_to: ""
    
    # SMTP server (optional, leave empty for auto-detection)
    # Auto-detected for: Gmail, QQ, Outlook, 163, 126, Sina, Sohu
    email_smtp_server: ""
    
    # SMTP port (optional, leave empty for auto-detection)
    # Common ports: 587 (TLS), 465 (SSL)
    email_smtp_port: ""
    
    # ntfy Push Notification
    # Server URL (default: public ntfy.sh service)
    # For self-hosted: "http://your-server.com"
    ntfy_server_url: "https://ntfy.sh"
    
    # Topic name (choose a hard-to-guess name for security)
    # Example: "trendradar-yourname-8492"
    # No Chinese characters, only letters/numbers/underscores/hyphens
    ntfy_topic: ""
    
    # Access token (optional, only for private topics)
    ntfy_token: ""

# =============================================================================
# TRENDING ALGORITHM WEIGHTS
# =============================================================================
# Customize how news is ranked and sorted
# ⚠️ All three weights MUST sum to 1.0
weight:
  # Ranking weight (0.0 - 1.0)
  # Higher = prioritize top-ranked news
  rank_weight: 0.6
  
  # Frequency weight (0.0 - 1.0)
  # Higher = prioritize repeatedly appearing news
  frequency_weight: 0.3
  
  # Hotness weight (0.0 - 1.0)
  # Higher = prioritize consistently high-ranked news
  hotness_weight: 0.1

# =============================================================================
# MONITORING PLATFORMS
# =============================================================================
# Configure which news sources to monitor
# Add or remove platforms as needed
platforms:
  # ---------------------------------------------------------------------------
  # Chinese News Sources (11 platforms)
  # ---------------------------------------------------------------------------
  
  - id: "toutiao"
    name: "Toutiao"
  
  - id: "baidu"
    name: "Baidu Hot Search"
  
  - id: "wallstreetcn-hot"
    name: "Wallstreetcn"
  
  - id: "thepaper"
    name: "The Paper"
  
  - id: "bilibili-hot-search"
    name: "Bilibili Hot"
  
  - id: "cls-hot"
    name: "Yicai"
  
  - id: "ifeng"
    name: "Ifeng"
  
  - id: "tieba"
    name: "Tieba"
  
  - id: "weibo"
    name: "Weibo"
  
  - id: "douyin"
    name: "Douyin"
  
  - id: "zhihu"
    name: "Zhihu"
  
  # ---------------------------------------------------------------------------
  # USA Financial Market Sources (5 platforms)
  # ---------------------------------------------------------------------------
  
  - id: "yahoo-finance-trending"
    name: "Yahoo Finance Trending"
    enabled: true
    language: "en"
    category: "finance"
    config:
      data_type: ["trending", "gainers", "losers"]
  
  - id: "seeking-alpha"
    name: "Seeking Alpha"
    enabled: true
    language: "en"
    category: "finance"
    config:
      topics: ["market_news", "earnings"]
  
  - id: "benzinga"
    name: "Benzinga"
    enabled: true
    language: "en"
    category: "finance"
    config:
      channels: ["news", "analyst_ratings"]
  
  - id: "marketwatch"
    name: "MarketWatch"
    enabled: true
    language: "en"
    category: "finance"
    config:
      sections: ["breaking", "market_pulse"]
  
  - id: "finviz-news"
    name: "Finviz"
    enabled: true
    language: "en"
    category: "finance"
    config:
      filters: ["news"]

