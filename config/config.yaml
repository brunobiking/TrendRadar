app:
  version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version"
  show_version_update: true # Control whether to show version update prompt. If false, version updates will not be displayed

crawler:
  request_interval: 1000 # Request interval (milliseconds)
  enable_crawler: true # Whether to enable news crawling. If false, program will stop directly
  use_proxy: false # Whether to enable proxy. False means disabled
  default_proxy: "http://127.0.0.1:10086"

# 🔸 daily (Daily Summary Mode)
#   • Push timing: Scheduled push (default: once per hour)
#   • Display content: All matched news of the day + new news section
#   • Use case: Daily report summary, comprehensive understanding of daily trending topics
#
# 🔸 current (Current Rankings Mode)
#   • Push timing: Scheduled push (default: once per hour)
#   • Display content: Current ranking matched news + new news section
#   • Use case: Real-time trending tracking, understanding current hottest content
#
# 🔸 incremental (Incremental Monitoring Mode)
#   • Push timing: Push only when there are new items
#   • Display content: Newly appeared news matching frequency keywords
#   • Use case: Avoid duplicate information interference

# Push mode selection
report:
  mode: "daily" # Options: "daily"|"incremental"|"current"
  rank_threshold: 5 # Ranking highlight threshold

notification:
  enable_notification: true # Whether to enable notification. If false, no mobile notifications will be sent
  message_batch_size: 4000 # Message batch size (bytes) (don't modify this config)
  dingtalk_batch_size: 20000 # DingTalk message batch size (bytes) (don't modify this config either)
  feishu_batch_size: 29000 # Feishu message batch size (bytes)
  batch_send_interval: 3 # Batch send interval (seconds)
  feishu_message_separator: "━━━━━━━━━━━━━━━━━━━" # Feishu message separator line

  # 🕐 Push Time Window Control (Optional Feature)
  # Purpose: Limit the time range for push notifications to avoid disturbances during non-work hours
  # Use cases:
  #   - Only want to receive pushes during work hours (e.g., 09:00-18:00)
  #   - Want to receive summary at fixed evening time (e.g., 20:00-22:00)
  push_window:
    enabled: false  # Whether to enable push time window control, disabled by default
    # Note: GitHub Actions execution time is unstable, suggest time range of at least 2 hours
    # For precise scheduled push, recommend using Docker deployment on personal server
    time_range:
      start: "20:00"  # Push time window start (Beijing Time)
      end: "22:00"    # Push time window end (Beijing Time)
    once_per_day: true  # Push only once per day within time window. If false, push every execution within window
    push_record_retention_days: 7  # Push record retention days

  # Please keep webhooks properly secured and do not make them public
  # If you deploy this project on GitHub via fork, do NOT fill in any webhooks here. Instead, put webhooks in GitHub Secret
  # Otherwise, at best you'll receive strange ads on your phone, at worst there are more serious security risks
  webhooks:
    feishu_url: "" # Feishu bot webhook URL
    dingtalk_url: "" # DingTalk bot webhook URL
    wework_url: "" # WeWork (Enterprise WeChat) bot webhook URL
    telegram_bot_token: "" # Telegram Bot Token
    telegram_chat_id: "" # Telegram Chat ID
    email_from: "" # Sender email address
    email_password: "" # Sender email password or authorization code
    email_to: "" # Recipient email address, multiple recipients separated by commas
    email_smtp_server: "" # SMTP server address (optional, leave empty for auto-detection)
    email_smtp_port: "" # SMTP port (optional, leave empty for auto-detection)
    ntfy_server_url: "https://ntfy.sh" # ntfy server address, default uses public service, can be changed to self-hosted address
    ntfy_topic: "" # ntfy topic name
    ntfy_token: "" # ntfy access token (optional, for private topics)

# Used to display news with higher attention in front, i.e., use algorithm to recombine trending searches from different platforms to form your focused trending, total should be 1
weight:
  rank_weight: 0.6 # Ranking weight
  frequency_weight: 0.3 # Frequency weight
  hotness_weight: 0.1 # Hotness weight

# name can be defined as any name, only has display purpose. Even if name is changed after project runs for several days, it won't affect normal code operation
platforms:
  - id: "toutiao"
    name: "Toutiao"
  - id: "baidu"
    name: "Baidu Hot"
  - id: "wallstreetcn-hot"
    name: "Wallstreetcn"
  - id: "thepaper"
    name: "Thepaper"
  - id: "bilibili-hot-search"
    name: "Bilibili Hot"
  - id: "cls-hot"
    name: "Yicai Hot"
  - id: "ifeng"
    name: "Ifeng"
  - id: "tieba"
    name: "Tieba"
  - id: "weibo"
    name: "Weibo"
  - id: "douyin"
    name: "Douyin"
  - id: "zhihu"
    name: "Zhihu"
  
  # USA Financial Market Sources
  - id: "yahoo-finance-trending"
    name: "Yahoo Finance Trending"
    enabled: true
    language: "en"
    category: "finance"
    config:
      data_type: ["trending", "gainers", "losers"]
      
  - id: "seeking-alpha"
    name: "Seeking Alpha Market News"
    enabled: true
    language: "en"
    category: "finance"
    config:
      topics: ["market_news", "earnings"]
      
  - id: "benzinga"
    name: "Benzinga Real-time News"
    enabled: true
    language: "en"
    category: "finance"
    config:
      channels: ["news", "analyst_ratings"]
      
  - id: "marketwatch"
    name: "MarketWatch Breaking News"
    enabled: true
    language: "en"
    category: "finance"
    config:
      sections: ["breaking", "market_pulse"]
      
  - id: "finviz-news"
    name: "Finviz Market News"
    enabled: true
    language: "en"
    category: "finance"
    config:
      filters: ["news"]
